<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OMNIA — 3D Anime World</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="omnia-app">
    <header>
      <div class="brand">OMNIA <span>3D ANIME</span></div>
      <div class="coins">✦ 250 Coins</div>
    </header>
    <div class="main">
      <div class="stage" id="stage-box">
        <div class="badge" id="status">Loading Niecee C...</div>
        <canvas id="stage-canvas"></canvas>
        <div class="controls">
          <button id="spin-btn">Auto-Spin</button>
          <button id="flip-btn">Flip 180°</button>
        </div>
      </div>
      <div class="panel">
        <h2>Omnia Signature Stances</h2>
        <p>Upload your custom VRoid (.vrm) character:</p>
        <input type="file" id="file-picker" accept=".vrm,.glb" class="upload-btn" />
        <label>OMNIA USERNAME</label>
        <input type="text" value="Niecee_C" />
        <label>ORIGINAL OMNIA STANCES &amp; FX</label>
        <div class="pose-btns" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
          <button data-pose="zerog">Zero-G Float 🌌</button>
          <button data-pose="holo">Holo-Stream 📡</button>
          <button data-pose="arcade">Arcade Win 🎮</button>
          <button data-pose="domain">Domain Seal 🔮</button>
          <button data-pose="cyberdash">Cyber-Dash ⚡</button>
          <button data-pose="djmix">Beat-Drop DJ 🎧</button>
          <button data-pose="stargaze">Star-Gazer ✨</button>
          <button data-pose="crown">Crown Summon 👑</button>
        </div>
        <label>STAGE LIGHTING</label>
                <label>ORIGINAL OMNIA ATMOSPHERES</label>
        <div class="light-btns" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
          <button data-theme="eclipse">🌑 Aether Eclipse</button>
          <button data-theme="sakura">🌸 Sakura Glitch</button>
          <button data-theme="biolume">🪼 Abyssal Biolume</button>
          <button data-theme="prism">✨ Celestial Prism</button>
          <button data-theme="overdrive">⚡ Void Overdrive</button>
          <button data-theme="solaris">🌅 Solaris Mirage</button>
        </div>

  <script type="module" src="./script.js"></script>
</body>
</html>
