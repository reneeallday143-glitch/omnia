<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Omnia VRM Studio — Niecee C</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d1117; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; height: 100vh; overflow: hidden; }
    #stage-wrap { position: relative; flex: 1; height: 100vh; background: radial-gradient(circle at 50% 45%, #1c1236 0%, #090d12 100%); overflow: hidden; }
    #stage-canvas { width: 100%; height: 100%; display: block; }
    #bottom-controls { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 6px; background: rgba(13,17,23,0.92); padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.14); }
    .ctrl-btn { background: #1e2433; color: #e2e8f0; border: 1px solid rgba(255,255,255,0.12); padding: 5px 10px; border-radius: 5px; font-size: 11px; cursor: pointer; white-space: nowrap; }
    .ctrl-btn:hover { background: #2c354a; }
    .ctrl-btn.active { background: #4f46e5; border-color: #818cf8; color: #fff; }
    #sidebar { width: 480px; height: 100vh; background: #11141d; border-left: 1px solid rgba(255,255,255,0.1); overflow-y: auto; padding: 12px 14px 28px; display: flex; flex-direction: column; gap: 13px; }
    #sidebar::-webkit-scrollbar { width: 6px; }
    #sidebar::-webkit-scrollbar-thumb { background: #2d3248; border-radius: 3px; }
    .section-title { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; color: #8b93b0; text-transform: uppercase; margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.07); }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .pose-btn { background: #1a1f2e; color: #d8deef; border: 1px solid rgba(255,255,255,0.09); border-radius: 6px; padding: 7px 8px; font-size: 11.5px; cursor: pointer; text-align: center; transition: 0.15s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pose-btn:hover { background: #262d42; border-color: rgba(255,255,255,0.22); }
    .pose-btn.active { background: #2b3254; border-color: #6366f1; color: #fff; font-weight: 600; box-shadow: 0 0 0 1px #6366f1 inset; }
  </style>
</head>
<body>
  <div id="stage-wrap">
    <div id="bottom-controls">
      <button class="ctrl-btn" id="pause-btn" onclick="togglePause()">⏸ Stand Still (Playing)</button>
      <button class="ctrl-btn" onclick="flipModel()">🔄 Flip 180°</button>
      <button class="ctrl-btn" onclick="zoomCam(-0.28)">➕ Zoom In</button>
      <button class="ctrl-btn" onclick="zoomCam(0.28)">➖ Zoom Out</button>
      <button class="ctrl-btn" onclick="faceCam()">😊 Face Cam</button>
    </div>
  </div>


  <div id="sidebar">
    <div>
      <div class="section-title">ALL FACIAL EXPRESSIONS (12)</div>
      <div class="grid-3">
        <button class="pose-btn active" onclick="setExpr('neutral', this)">😐 Neutral</button>
        <button class="pose-btn" onclick="setExpr('happy', this)">😄 Happy</button>
        <button class="pose-btn" onclick="setExpr('oh', this)">😮 Big Grin</button>
        <button class="pose-btn" onclick="setExpr('sad', this)">😢 Sad</button>
        <button class="pose-btn" onclick="setExpr('sorrow', this)">😭 Crying</button>
        <button class="pose-btn" onclick="setExpr('angry', this)">😠 Angry</button>
        <button class="pose-btn" onclick="setExpr('furious', this)">😡 Furious</button>
        <button class="pose-btn" onclick="setExpr('surprised', this)">😲 Surprised</button>
        <button class="pose-btn" onclick="setExpr('shocked', this)">😱 Shocked</button>
        <button class="pose-btn" onclick="setExpr('wink', this)">😉 Wink</button>
        <button class="pose-btn" onclick="setExpr('smug', this)">😏 Smug</button>
        <button class="pose-btn" onclick="setExpr('relaxed', this)">😴 Sleepy</button>
      </div>
    </div>


    <div>
      <div class="section-title">SIGNATURE HAND GESTURES</div>
      <div class="grid-2" id="hand-grid">
        <button class="pose-btn active" onclick="setHand('relaxed', this)">🫳 Relaxed Hands</button>
        <button class="pose-btn" onclick="setHand('peace', this)">✌️ Peace Sign</button>
        <button class="pose-btn" onclick="setHand('kheart', this)">🫰 Korean Heart</button>
        <button class="pose-btn" onclick="setHand('rock', this)">🤘 Rock On</button>
        <button class="pose-btn" onclick="setHand('omniaSign', this)">🔺 Omnia Prism Sign</button>
        <button class="pose-btn" onclick="setHand('bird', this)">🖕 Middle Finger</button>
        <button class="pose-btn" onclick="setHand('rebel2', this)">🖕🖕 Double Middle Finger</button>
        <button class="pose-btn" onclick="setHand('westside', this)">🇼 West Coast W</button>
        <button class="pose-btn" onclick="setHand('vulcan', this)">🖖 Vulcan Salute</button>
        <button class="pose-btn" onclick="setHand('shaka', this)">🤙 Shaka / Hang Loose</button>
      </div>
    </div>


    <div>
      <div class="section-title">CREATOR ATTITUDE POSES</div>
      <div class="grid-2" id="attitude-grid">
        <button class="pose-btn" onclick="setHand('relaxed', this)">🧍 Arms Down (Idle)</button>
        <button class="pose-btn" onclick="setHand('hips', this)">💁 Hands on Hips</button>
        <button class="pose-btn" onclick="setHand('crossedArms', this)">🙅 Arms Folded</button>
        <button class="pose-btn" onclick="setHand('gangster', this)">😎 Gangster Lean</button>
        <button class="pose-btn" onclick="setHand('worldFlex', this)">👑 Royal Flex</button>
        <button class="pose-btn" onclick="setHand('wave', this)">👋 Hero Wave</button>
      </div>
    </div>


    <div>
      <div class="section-title">ORIGINAL OMNIA STANCES & FX</div>
      <div class="grid-2" id="stance-grid">
        <button class="pose-btn active" onclick="setStance('none', this)">🧍 Standard Grounded</button>
        <button class="pose-btn" onclick="setStance('float', this)">✨ Zero-G Float</button>
        <button class="pose-btn" onclick="setStance('holo', this)">💠 Holo-Stream</button>
        <button class="pose-btn" onclick="setStance('arcade', this)">🕹️ Arcade Win</button>
        <button class="pose-btn" onclick="setStance('domain', this)">🌌 Domain Seal</button>
        <button class="pose-btn" onclick="setStance('dash', this)">⚡ Cyber-Dash</button>
        <button class="pose-btn" onclick="setStance('dj', this)">🎧 Beat-Drop DJ</button>
        <button class="pose-btn" onclick="setStance('stargazer', this)">🌠 Star-Gazer</button>
        <button class="pose-btn active" id="crown-toggle" onclick="toggleCrown()">👑 Crown Summon</button>
      </div>
    </div>


    <div>
      <div class="section-title">BODY MOVEMENTS & ACTIONS</div>
      <div class="grid-2" id="action-grid">
        <button class="pose-btn" onclick="setStance('sprint', this)">🏃 Neon Sprint</button>
        <button class="pose-btn" onclick="setStance('skyleap', this)">🚀 Sky Leap</button>
        <button class="pose-btn" onclick="setHand('clap', this)">👏 Hyper Clap</button>
        <button class="pose-btn" onclick="setStance('vortex', this)">🌀 Vortex Spin</button>
      </div>
    </div>


    <div>
      <div class="section-title">CUSTOM STAGE BACKGROUNDS (ILLUSTRATED SCENES)</div>
      <div class="grid-2">
        <button class="pose-btn" onclick="setBg('cyber', this)">🌃 Cyber Tokyo Rooftop</button>
        <button class="pose-btn" onclick="setBg('sakura', this)">🌸 Sakura Shrine Night</button>
        <button class="pose-btn" onclick="setBg('skylounge', this)">🏙️ Sky Lounge Penthouse</button>
        <button class="pose-btn" onclick="setBg('omnialobby', this)">💠 Omnia Neon Lobby</button>
        <button class="pose-btn" onclick="setBg('nebula', this)">🌌 Starlight Nebula</button>
        <button class="pose-btn" onclick="setBg('miami', this)">🌴 Miami Vaporwave</button>
        <button class="pose-btn" onclick="setBg('crimson', this)">🔥 Crimson Boss Arena</button>
        <button class="pose-btn active" onclick="setBg('studio', this)">📸 Clean Photo Studio</button>
      </div>
    </div>


    <div>
      <div class="section-title">ATMOSPHERES & MOVING 3D PARTICLES</div>
      <div class="grid-2">
        <button class="pose-btn" onclick="setFx('petals', this)">🌸 Sakura Glitch (Petals)</button>
        <button class="pose-btn" onclick="setFx('embers', this)">🔥 Aether Eclipse (Embers)</button>
        <button class="pose-btn" onclick="setFx('bubbles', this)">🫧 Abyssal Biolume (Bubbles)</button>
        <button class="pose-btn" onclick="setFx('sparks', this)">✨ Celestial Prism (Sparks)</button>
        <button class="pose-btn" onclick="setFx('lasers', this)">⚡ Void Overdrive (Lasers)</button>
        <button class="pose-btn active" onclick="setFx('motes', this)">☀️ Solaris Mirage (Motes)</button>
      </div>
    </div>
  </div>




<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.0/lib/three-vrm.module.js"
  }
}
</script>
<script type="module" src="script.js"></script>
</body>
</html>
