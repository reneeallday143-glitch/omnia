<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VRM Full Arm, Hand & Finger Sign Studio</title>
  <style>
    body { margin: 0; overflow: hidden; background: #12141a; font-family: system-ui, sans-serif; color: #fff; }
    #ui { position: fixed; top: 14px; left: 14px; z-index: 10; display: flex; flex-direction: column; gap: 10px; max-width: 95vw; }
    .panel { background: rgba(20, 24, 34, 0.85); backdrop-filter: blur(10px); padding: 10px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.12); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .chip { background: #262c3d; color: #e2e8f0; border: 1px solid rgba(255,255,255,0.1); padding: 6px 11px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: 0.15s; }
    .chip:hover { background: #363f57; }
    .chip.active { background: #6366f1; color: #fff; border-color: #818cf8; font-weight: 600; }
    input[type="file"] { font-size: 12px; color: #cbd5e1; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://jsdelivr.net",
      "three/addons/": "https://jsdelivr.net",
      "@pixiv/three-vrm": "https://jsdelivr.net"
    }
  }
  </script>
</head>
<body>
  <div id="ui">
    <div class="panel">
      <label><strong>Load VRM:</strong> <input type="file" id="vrm-file" accept=".vrm" /></label>
      <span id="status" style="font-size:12px;color:#94a3b8;">Upload a .vrm character to start</span>
    </div>
    <div class="panel" id="hand-bar">
      <button class="chip active" onclick="setHand('relaxed', this)">🫳 Relaxed</button>
      <button class="chip" onclick="setHand('crossedArms', this)">🙅 Crossed Arms</button>
      <button class="chip" onclick="setHand('open', this)">✋ Open</button>
      <button class="chip" onclick="setHand('peace', this)">✌️ Peace</button>
      <button class="chip" onclick="setHand('kheart', this)">🫰 Finger Heart</button>
      <button class="chip" onclick="setHand('westside', this)">🇼 West Coast</button>
      <button class="chip" onclick="setHand('vulcan', this)">🖖 Vulcan</button>
      <button class="chip" onclick="setHand('shaka', this)">🤙 Shaka</button>
      <button class="chip" onclick="setHand('rock', this)">🤘 Horns</button>
      <button class="chip" onclick="setHand('bird', this)">🖕 Single</button>
      <button class="chip" onclick="setHand('rebel2', this)">🖕🖕 Double</button>
      <button class="chip" onclick="setHand('omniaSign', this)">🔺 Omnia Prism</button>
      <button class="chip" onclick="setHand('worldFlex', this)">👑 World Flex</button>
      <button class="chip" id="crown-btn" onclick="toggleCrown()">✨ Crown: ON</button>
    </div>
  </div>
  <script type="module" src="./script.js"></script>
</body>
</html>
